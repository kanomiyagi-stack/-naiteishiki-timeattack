<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PROJECT: ONE COMMIT</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/html5-qrcode"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<style>
  :root{
    --gold:#d4af37;
    --gold-light:#f3d98a;
    --black:#0f0f0f;
    --green:#22c55e;
    --red:#ef4444;
    --white:#f8fafc;
  }
  html,body{background:var(--black); color:var(--white); font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif; overscroll-behavior:none;}
  .gold-text{
    background:linear-gradient(120deg,#f3d98a,#d4af37,#a97f1a,#f3d98a);
    background-size:200% auto;
    -webkit-background-clip:text; background-clip:text; color:transparent;
    animation:sheen 4s linear infinite;
  }
  @keyframes sheen{0%{background-position:0% 50%}100%{background-position:200% 50%}}
  .btn-gold{
    background:linear-gradient(135deg,#f3d98a,#d4af37 40%,#a97f1a);
    color:#181104; font-weight:700; border-radius:16px;
    box-shadow:0 4px 18px rgba(212,175,55,0.35), inset 0 1px 0 rgba(255,255,255,0.5);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .btn-gold:active{transform:scale(.96); box-shadow:0 2px 8px rgba(212,175,55,0.25), inset 0 1px 0 rgba(255,255,255,0.4);}
  .btn-outline{
    border:1.5px solid var(--gold); color:var(--gold); border-radius:16px; background:rgba(212,175,55,0.06);
    transition:transform .12s ease;
  }
  .btn-outline:active{transform:scale(.96);}
  .card{
    background:linear-gradient(180deg,#1a1a1a,#111111);
    border:1px solid rgba(212,175,55,0.25);
    border-radius:20px;
  }
  .glow-border{box-shadow:0 0 0 1px rgba(212,175,55,0.4), 0 8px 30px rgba(0,0,0,0.5);}
  .fade-in{animation:fadein .35s ease both;}
  @keyframes fadein{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}
  .pop{animation:pop .4s cubic-bezier(.34,1.56,.64,1) both;}
  @keyframes pop{from{opacity:0; transform:scale(.85);} to{opacity:1; transform:scale(1);}}
  .status-dot{width:12px;height:12px;border-radius:50%;}
  ::-webkit-scrollbar{width:0px;background:transparent;}
  #qr-reader video{border-radius:16px;}
  @media print{
    body{background:#fff !important; color:#000 !important;}
    .no-print{display:none !important;}
  }
</style>
</head>
<body class="min-h-screen">
<div id="app" class="min-h-screen max-w-md mx-auto px-4 py-6 flex flex-col"></div>

<script>
/* =========================================================
   PROJECT: ONE COMMIT — データ定義
   ========================================================= */
const TEAMS = ['A','B','C','D','E'];
const PLAYERS = ['P1','P2','P3','P4'];
const PLAYER_LABEL = {P1:'プレイヤー1', P2:'プレイヤー2', P3:'プレイヤー3', P4:'プレイヤー4'};

const PUZZLES = [
  {
    qrId: 'QR_Nazo1',
    id: 'nazo1',
    level: 'LEVEL 1',
    title: 'アセスメント：4つの視点と原点',
    story: '理想の変化を起こすには、まず現在のチームメンバーの特長を正しくアセスメントする必要がある。',
    points: 800,
    answer: 'きづき',
    hint: 'お互いの出身地や学生時代の思い出を話し合ってみよう！',
    lockMinutes: 1,
    content: {
      P1: '【プレイヤー1専用情報】\n文字盤A：1番目の文字は「チーム内で一番遠くから来た人の【誕生月】の数字番目のひらがな」です。',
      P2: '【プレイヤー2専用情報】\n文字盤B：2番目の文字は「学生時代に一番打ち込んだことの文字数が最も長い人の【名前の頭文字】」です。',
      P3: '【プレイヤー3専用情報】\n文字盤C：3番目の文字は「RIZAPのメインカラー（金/黒）をひらがなで表した時『きん』の最初の文字」です。',
      P4: '【プレイヤー4専用情報】\n解法指示：文字盤A, B, Cの文字を順に並べ、最後に「つ」を付けると答えになります。'
    }
  },
  {
    qrId: 'QR_Nazo2',
    id: 'nazo2',
    level: 'LEVEL 2',
    title: 'プロセス：壁を壊すロジックチェーン',
    story: 'ゲストの挫折を防ぐには、4人の視点を組み合わせた完璧な「軌道修正プログラム」が必要だ。',
    points: 1000,
    answer: 'に',
    hint: '4人の共通点（例：26卒など）の文字数を足してみましょう。',
    lockMinutes: 2,
    content: {
      P1: '【プレイヤー1専用情報】\nターゲットAの数値：チョコザップの月額料金（約3000円）の千の位 ＝ 【3】',
      P2: '【プレイヤー2専用情報】\nターゲットBの数値：RIZAPの1セッション（50分）の十の位 ＝ 【5】',
      P3: '【プレイヤー3専用情報】\n計算式：(P1の数値 × P2の数値) − 3 ＝ 【12】',
      P4: '【プレイヤー4専用情報】\n最終変換：計算結果の数値「12（じゅうに）」の【最後の文字】を答えに入力せよ。'
    }
  },
  {
    qrId: 'QR_Nazo3',
    id: 'nazo3',
    level: 'LEVEL 3',
    title: 'コミットメント：最高の約束',
    story: 'すべての謎を解き明かしたあなたたち。しかし最高のサービスを創るために最後に必要なのは、テクニックではなく『人』そのものだった。',
    points: 1200,
    answer: 'つながり',
    hint: '仲間が話す「尊敬する人」「挑戦」「強み」の頭文字を整理しましょう。',
    lockMinutes: 0,
    noAutoLock: true,
    content: {
      P1: '【プレイヤー1専用情報】\nP2の人に「一番尊敬する人」を聞き、その頭文字を覚えよ。',
      P2: '【プレイヤー2専用情報】\nP3の人に「入社後に挑戦したいこと」を聞き、その頭文字を覚えよ。',
      P3: '【プレイヤー3専用情報】\nP4の人に「自分の強み」を聞き、その頭文字を覚えよ。',
      P4: '【プレイヤー4専用情報】\n全員で集めた文字とP1の名前の頭文字を並べ替え、「つながり」という言葉を作って全員で叫んでから入力せよ。'
    }
  }
];

const DUMMIES = [
  { qrId:'QR_Dummy1', id:'dummy1', title:'RIZAP特別ミッション！', message:'チーム全員で最高の笑顔で決めポーズをせよ！達成したらボーナス+100pt！', bonusPoints:100, location:'受付テーブルの下' },
  { qrId:'QR_Dummy2', id:'dummy2', title:'チョコザップ体験ミッション！', message:'その場で足踏み20回！達成したらボーナス+100pt！', bonusPoints:100, location:'ドリンクコーナー裏' },
  { qrId:'QR_Dummy3', id:'dummy3', title:'トラップ発見！', message:'司会者に「お疲れ様です！」と挨拶するとヒントが解放される……かも？ボーナス+100pt！', bonusPoints:100, location:'司会者マイクスタンド' }
];

function findPuzzleByQr(qr){ return PUZZLES.find(p=>p.qrId.toLowerCase()===qr.toLowerCase()); }
function findDummyByQr(qr){ return DUMMIES.find(d=>d.qrId.toLowerCase()===qr.toLowerCase()); }

/* =========================================================
   状態管理（localStorage）
   ========================================================= */
const STORAGE_KEY = 'oneCommitState_v1';

function defaultState(){
  return {
    team: null,
    player: null,
    completedPuzzles: [],
    scannedQRs: [],
    hintsUsed: {},
    dummyBonusClaimed: [],
    introBonusChecks: [false,false,false,false],
    startTime: null,
    lockUntil: {}
  };
}
function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){ return Object.assign(defaultState(), JSON.parse(raw)); }
  }catch(e){}
  return defaultState();
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

let state = loadState();
let currentView = (state.team && state.player) ? 'dashboard' : 'top';
let activeQr = null;
let timerHandle = null;
let lockTickHandle = null;
let html5QrCodeInstance = null;
let pendingQrFromUrl = null;

function computeScore(){
  let total = 0;
  PUZZLES.forEach(p=>{
    if(state.completedPuzzles.includes(p.id)){
      const hints = state.hintsUsed[p.id] || 0;
      total += Math.max(0, p.points - hints*100);
    }
  });
  DUMMIES.forEach(d=>{
    if(state.dummyBonusClaimed.includes(d.id)) total += d.bonusPoints;
  });
  const introChecked = state.introBonusChecks.filter(Boolean).length;
  total += introChecked * 125;
  return total;
}

function allCleared(){ return PUZZLES.every(p=>state.completedPuzzles.includes(p.id)); }

function normalizeAnswer(s){
  return (s||'').replace(/\s+/g,'').replace(/[　]/g,'').trim();
}

/* =========================================================
   画面遷移
   ========================================================= */
function goTo(view){
  currentView = view;
  render();
}

function resetAll(){
  if(!confirm('進行状況とスコアをすべてリセットします。よろしいですか？')) return;
  state = defaultState();
  saveState();
  goTo('top');
}

/* =========================================================
   レンダリング
   ========================================================= */
function render(){
  clearTimers();
  const app = document.getElementById('app');
  switch(currentView){
    case 'top': app.innerHTML = viewTop(); break;
    case 'select': app.innerHTML = viewSelect(); break;
    case 'dashboard': app.innerHTML = viewDashboard(); break;
    case 'scan': app.innerHTML = viewScan(); break;
    case 'puzzle': app.innerHTML = viewPuzzle(); break;
    case 'correct': app.innerHTML = viewCorrect(); break;
    case 'dummy': app.innerHTML = viewDummy(); break;
    case 'result': app.innerHTML = viewResult(); break;
    case 'admin-qr': app.innerHTML = viewAdminQR(); break;
    default: app.innerHTML = viewTop();
  }
  afterRender();
}

function clearTimers(){
  if(timerHandle){ clearInterval(timerHandle); timerHandle=null; }
  if(lockTickHandle){ clearInterval(lockTickHandle); lockTickHandle=null; }
  if(html5QrCodeInstance){
    try{
      html5QrCodeInstance.stop().then(()=>html5QrCodeInstance.clear()).catch(()=>{});
    }catch(e){}
    html5QrCodeInstance = null;
  }
}

function afterRender(){
  if(currentView === 'dashboard') startDashboardTimer();
  if(currentView === 'scan') initScanner();
  if(currentView === 'puzzle') startLockTicker();
}

/* ---------- TOP ---------- */
function viewTop(){
  return `
  <div class="flex-1 flex flex-col items-center justify-center text-center fade-in">
    <div class="mb-2 text-xs tracking-widest text-gray-400">RIZAP GROUP 内定式</div>
    <h1 class="text-3xl font-black gold-text leading-tight mb-1">PROJECT:<br>ONE COMMIT</h1>
    <p class="text-sm text-gray-400 mt-2 mb-10">〜4つの個性が重なる時、未来が変わる〜</p>
    <button onclick="goTo('select')" class="btn-gold w-full py-4 text-lg mb-4">ゲームを開始する</button>
    ${(state.team && state.player) ? `<button onclick="goTo('dashboard')" class="btn-outline w-full py-3 text-sm mb-8">続きから再開する（${state.team}チーム / ${PLAYER_LABEL[state.player]}）</button>` : '<div class="mb-8"></div>'}
    <div class="text-[11px] text-gray-500 no-print">
      <a href="javascript:goTo('admin-qr')" class="underline">▸ 運営者用: QRコード生成ページ</a>
    </div>
  </div>`;
}

/* ---------- チーム＆プレイヤー選択 ---------- */
function viewSelect(){
  const teamBtns = TEAMS.map(t=>`
    <button onclick="pickTeam('${t}')" class="${state.team===t?'btn-gold':'btn-outline'} py-3 rounded-2xl font-bold">${t}</button>
  `).join('');
  const playerBtns = PLAYERS.map(p=>`
    <button onclick="pickPlayer('${p}')" class="${state.player===p?'btn-gold':'btn-outline'} py-3 rounded-2xl font-bold text-sm">${PLAYER_LABEL[p]}</button>
  `).join('');
  return `
  <div class="flex-1 flex flex-col fade-in">
    <h2 class="text-xl font-bold gold-text mb-6 mt-4">チーム＆プレイヤー選択</h2>
    <div class="mb-6">
      <div class="text-sm text-gray-400 mb-2">チームを選択</div>
      <div class="grid grid-cols-5 gap-2">${teamBtns}</div>
    </div>
    <div class="mb-8">
      <div class="text-sm text-gray-400 mb-2">あなたの役割を選択</div>
      <div class="grid grid-cols-2 gap-3">${playerBtns}</div>
    </div>
    <button onclick="confirmParticipation()" class="btn-gold w-full py-4 text-lg mt-auto">この設定で参加する</button>
  </div>`;
}
function pickTeam(t){ state.team = t; render_select_inplace(); }
function pickPlayer(p){ state.player = p; render_select_inplace(); }
function render_select_inplace(){ document.getElementById('app').innerHTML = viewSelect(); }
function confirmParticipation(){
  if(!state.team || !state.player){ alert('チームと役割を両方選択してください。'); return; }
  if(!state.startTime) state.startTime = Date.now();
  saveState();
  if(pendingQrFromUrl){
    const qr = pendingQrFromUrl;
    pendingQrFromUrl = null;
    goTo('dashboard');
    handleScannedText(qr);
  }else{
    goTo('dashboard');
  }
}

/* ---------- ダッシュボード ---------- */
function statusIcon(p){
  const done = state.completedPuzzles.includes(p.id);
  return `
    <div class="flex flex-col items-center gap-1">
      <div class="w-11 h-11 rounded-full flex items-center justify-center border-2 ${done?'border-[var(--green)] bg-[var(--green)]/10':'border-gray-600 bg-black/30'}">
        <span class="text-sm font-bold ${done?'text-[var(--green)]':'text-gray-500'}">${done?'✓':p.level.replace('LEVEL ','')}</span>
      </div>
      <span class="text-[10px] text-gray-400">${p.level}</span>
    </div>`;
}
function viewDashboard(){
  const cleared = allCleared();
  return `
  <div class="flex-1 flex flex-col fade-in">
    <div class="card glow-border p-4 mb-5">
      <div class="flex justify-between items-center mb-1">
        <div class="text-lg font-bold">${state.team} チーム</div>
        <div class="text-xs text-gray-400">${PLAYER_LABEL[state.player]}</div>
      </div>
      <div class="flex justify-between items-end">
        <div>
          <div class="text-[11px] text-gray-500">現在のスコア</div>
          <div class="text-2xl font-black gold-text">${computeScore()} pt</div>
        </div>
        <div class="text-right">
          <div class="text-[11px] text-gray-500">経過時間</div>
          <div id="timer-display" class="text-lg font-mono">00:00</div>
        </div>
      </div>
    </div>

    <button onclick="goTo('scan')" class="btn-gold w-full py-6 text-xl mb-6 rounded-3xl">📷 QRコードをスキャンする</button>

    <div class="card p-4 mb-6">
      <div class="text-xs text-gray-400 mb-3">解き明かした謎</div>
      <div class="flex justify-around">${PUZZLES.map(statusIcon).join('')}</div>
    </div>

    ${cleared ? `<button onclick="goTo('result')" class="btn-gold w-full py-4 mb-4">最終結果を見る</button>` : ''}
    <button onclick="resetAll()" class="text-[11px] text-gray-500 underline mt-auto">進行状況をリセット</button>
  </div>`;
}
function startDashboardTimer(){
  const el = document.getElementById('timer-display');
  if(!el) return;
  function tick(){
    if(!state.startTime){ el.textContent = '00:00'; return; }
    const sec = Math.floor((Date.now()-state.startTime)/1000);
    const m = String(Math.floor(sec/60)).padStart(2,'0');
    const s = String(sec%60).padStart(2,'0');
    el.textContent = `${m}:${s}`;
  }
  tick();
  timerHandle = setInterval(tick, 1000);
}

/* ---------- QRスキャン ---------- */
function viewScan(){
  return `
  <div class="flex-1 flex flex-col fade-in">
    <div class="flex justify-between items-center mb-4">
      <h2 class="text-lg font-bold">QRコードをスキャン</h2>
      <button onclick="goTo('dashboard')" class="text-sm text-gray-400 underline">キャンセル</button>
    </div>
    <div id="qr-reader" class="card p-2 mb-2 min-h-[260px] flex items-center justify-center">
      <div id="qr-reader-placeholder" class="text-xs text-gray-500">カメラを起動しています…</div>
    </div>
    <p id="camera-error" class="text-xs text-[var(--red)] mb-2 hidden">カメラを起動できませんでした。下の手入力フォームをご利用ください。</p>

    <div class="card p-3 mt-4 no-print">
      <div class="text-[11px] text-gray-500 mb-2">デバッグ用：QRコードIDを手入力</div>
      <div class="flex gap-2">
        <input id="manual-qr-input" type="text" placeholder="例）QR_Nazo1" class="flex-1 bg-black/40 border border-gray-700 rounded-lg px-3 py-2 text-sm text-white">
        <button onclick="submitManualQr()" class="btn-outline px-4 text-sm">送信</button>
      </div>
    </div>
  </div>`;
}
function initScanner(){
  const readerDiv = document.getElementById('qr-reader');
  if(!readerDiv || typeof Html5Qrcode === 'undefined'){
    showCameraError();
    return;
  }
  readerDiv.innerHTML = '<div id="qr-reader-inner" style="width:100%"></div>';
  try{
    html5QrCodeInstance = new Html5Qrcode('qr-reader-inner');
    html5QrCodeInstance.start(
      { facingMode: 'environment' },
      { fps: 10, qrbox: 220 },
      (decodedText) => { handleScannedText(decodedText); },
      () => {}
    ).catch(()=>showCameraError());
  }catch(e){
    showCameraError();
  }
}
function showCameraError(){
  const err = document.getElementById('camera-error');
  if(err) err.classList.remove('hidden');
  const ph = document.getElementById('qr-reader');
  if(ph) ph.innerHTML = '<div class="text-xs text-gray-500 p-6 text-center">カメラが利用できません。<br>下の手入力フォームをご利用ください。</div>';
}
function submitManualQr(){
  const input = document.getElementById('manual-qr-input');
  if(!input || !input.value.trim()) return;
  handleScannedText(input.value.trim());
}
function extractQrId(text){
  const t = (text||'').trim();
  try{
    if(t.includes('?qr=') || t.includes('&qr=')){
      const url = new URL(t, window.location.origin);
      const q = url.searchParams.get('qr');
      if(q) return q;
    }
  }catch(e){}
  return t;
}
function handleScannedText(text){
  if(html5QrCodeInstance){
    try{ html5QrCodeInstance.stop().then(()=>html5QrCodeInstance.clear()).catch(()=>{}); }catch(e){}
    html5QrCodeInstance = null;
  }
  const qr = extractQrId(text);
  const puzzle = findPuzzleByQr(qr);
  const dummy = findDummyByQr(qr);

  if(puzzle){
    if(state.completedPuzzles.includes(puzzle.id)){
      alert(`「${puzzle.title}」は既にクリア済みです。`);
      goTo('dashboard'); return;
    }
    if(!state.scannedQRs.includes(puzzle.qrId)){
      state.scannedQRs.push(puzzle.qrId);
      saveState();
    }
    activeQr = puzzle.qrId;
    goTo('puzzle');
    return;
  }
  if(dummy){
    if(state.dummyBonusClaimed.includes(dummy.id)){
      alert('このミッションは既に達成済みです。');
      goTo('dashboard'); return;
    }
    activeQr = dummy.qrId;
    goTo('dummy');
    return;
  }
  alert('無効なQRコードです。もう一度お試しください。');
  goTo('scan');
}

/* ---------- ダミーQR ---------- */
function viewDummy(){
  const d = findDummyByQr(activeQr);
  return `
  <div class="flex-1 flex flex-col items-center justify-center text-center fade-in">
    <div class="card glow-border p-6 pop">
      <div class="text-xs text-[var(--gold)] tracking-widest mb-2">RIZAP SPECIAL MISSION</div>
      <h2 class="text-xl font-bold mb-4">${d.title}</h2>
      <p class="text-sm text-gray-300 mb-6 leading-relaxed">${d.message}</p>
      <button onclick="claimDummyBonus('${d.id}')" class="btn-gold w-full py-3">ミッション達成！ボーナス獲得</button>
      <button onclick="goTo('dashboard')" class="text-xs text-gray-500 underline mt-4">達成せずに戻る</button>
    </div>
  </div>`;
}
function claimDummyBonus(id){
  if(!state.dummyBonusClaimed.includes(id)){
    state.dummyBonusClaimed.push(id);
    saveState();
  }
  alert('+100pt ボーナス獲得！');
  goTo('dashboard');
}

/* ---------- 謎解き画面 ---------- */
function isLocked(id){
  const until = state.lockUntil[id];
  return until && until > Date.now();
}
function viewPuzzle(){
  const p = findPuzzleByQr(activeQr);
  const hintsUsed = state.hintsUsed[p.id] || 0;
  const locked = isLocked(p.id);
  return `
  <div class="flex-1 flex flex-col fade-in">
    <div class="flex justify-between items-center mb-3">
      <span class="text-xs text-[var(--gold)] font-bold tracking-widest">${p.level}</span>
      <button onclick="goTo('dashboard')" class="text-xs text-gray-400 underline">ダッシュボードへ</button>
    </div>
    <h2 class="text-lg font-bold mb-2">${p.title}</h2>
    <p class="text-xs text-gray-400 mb-4 leading-relaxed">${p.story}</p>

    <div class="card p-4 mb-4">
      <div class="text-[11px] text-gray-500 mb-1">${PLAYER_LABEL[state.player]} に表示中の情報</div>
      <p class="text-sm whitespace-pre-line leading-relaxed">${p.content[state.player]}</p>
    </div>

    ${locked ? `
      <div class="card p-4 mb-4 border-[var(--red)]/40 text-center">
        <div class="text-sm text-[var(--red)] font-bold mb-1">不正解 — 再入力ロック中</div>
        <div id="lock-timer" class="text-2xl font-mono">--:--</div>
      </div>
    ` : `
      <div class="mb-4">
        <button ${hintsUsed>0?'disabled':''} onclick="useHint('${p.id}')" class="btn-outline w-full py-2 text-sm ${hintsUsed>0?'opacity-40':''}">
          💡 ヒントを見る（-100pt）${hintsUsed>0?'（使用済み）':''}
        </button>
        ${hintsUsed>0 ? `<p class="text-xs text-gray-400 mt-2 leading-relaxed">${p.hint}</p>` : ''}
      </div>

      <div class="mb-3">
        <input id="answer-input" type="text" placeholder="答えを入力" class="w-full bg-black/40 border border-gray-700 rounded-xl px-4 py-3 text-white text-lg">
      </div>
      <button onclick="submitAnswer('${p.id}')" class="btn-gold w-full py-4 text-lg">解答する</button>
    `}
  </div>`;
}
function startLockTicker(){
  const p = findPuzzleByQr(activeQr);
  if(!p) return;
  const el = document.getElementById('lock-timer');
  if(!el) return;
  function tick(){
    const remain = state.lockUntil[p.id] - Date.now();
    if(remain <= 0){
      render();
      return;
    }
    const sec = Math.ceil(remain/1000);
    const m = String(Math.floor(sec/60)).padStart(2,'0');
    const s = String(sec%60).padStart(2,'0');
    el.textContent = `${m}:${s}`;
  }
  tick();
  lockTickHandle = setInterval(tick, 1000);
}
function useHint(id){
  state.hintsUsed[id] = (state.hintsUsed[id]||0) + 1;
  saveState();
  render();
}
function submitAnswer(id){
  const p = PUZZLES.find(pp=>pp.id===id);
  const input = document.getElementById('answer-input');
  const val = normalizeAnswer(input ? input.value : '');
  if(!val) return;
  if(val === p.answer){
    if(!state.completedPuzzles.includes(id)){
      state.completedPuzzles.push(id);
      saveState();
    }
    goTo('correct');
  }else{
    if(p.noAutoLock){
      alert('不正解です。運営スタッフを呼んでください。');
      goTo('dashboard');
    }else{
      state.lockUntil[id] = Date.now() + p.lockMinutes*60*1000;
      saveState();
      render();
    }
  }
}

/* ---------- 正解画面 ---------- */
function viewCorrect(){
  const p = findPuzzleByQr(activeQr);
  const cleared = allCleared();
  return `
  <div class="flex-1 flex flex-col items-center justify-center text-center fade-in">
    <div class="card glow-border p-8 pop">
      <div class="text-4xl mb-3">✨</div>
      <h2 class="text-2xl font-black gold-text mb-2">正解！</h2>
      <p class="text-sm text-gray-300 mb-4">「${p.title}」をクリアしました。</p>
      <div class="text-xl font-bold mb-6">+${Math.max(0, p.points - (state.hintsUsed[p.id]||0)*100)} pt</div>
      <button onclick="goTo('${cleared?'result':'dashboard'}')" class="btn-gold w-full py-3">
        ${cleared ? '最終結果へ進む' : 'ダッシュボードへ戻る'}
      </button>
    </div>
  </div>`;
}

/* ---------- 最終結果 ---------- */
function viewResult(){
  const breakdown = PUZZLES.map(p=>{
    const done = state.completedPuzzles.includes(p.id);
    const hints = state.hintsUsed[p.id]||0;
    const pts = done ? Math.max(0, p.points - hints*100) : 0;
    return `<div class="flex justify-between text-sm py-1">
      <span class="${done?'text-white':'text-gray-500'}">${p.level} ${p.title}</span>
      <span class="${done?'text-[var(--gold)] font-bold':'text-gray-500'}">${done?`+${pts}`:'未クリア'}</span>
    </div>`;
  }).join('');
  const dummyPts = state.dummyBonusClaimed.length*100;
  const introChecks = state.introBonusChecks;
  const introBoxes = ['出身地/学生時代の話を共有した','趣味・価値観を共有した','尊敬する人/挑戦したいことを話した','お互いの強みを共有した'].map((label,i)=>`
    <label class="flex items-center gap-2 text-xs py-1">
      <input type="checkbox" ${introChecks[i]?'checked':''} onchange="toggleIntroBonus(${i})" class="w-4 h-4">
      <span>${label}（+125pt）</span>
    </label>`).join('');

  return `
  <div class="flex-1 flex flex-col fade-in">
    <div class="text-center mb-4">
      <div class="text-xs text-gray-400 tracking-widest mb-1">FINAL COMMITMENT</div>
      <h2 class="text-2xl font-black gold-text">${allCleared()?'コミットメント完了！':'挑戦中'}</h2>
    </div>
    <div class="card p-4 mb-4">
      ${breakdown}
      <div class="flex justify-between text-sm py-1 border-t border-gray-700 mt-2 pt-2">
        <span>特別ミッション ボーナス</span><span class="text-[var(--gold)] font-bold">+${dummyPts}</span>
      </div>
    </div>
    <div class="card p-4 mb-4">
      <div class="text-xs text-gray-400 mb-2">自己紹介ボーナス（自己申告・最大+500pt）</div>
      ${introBoxes}
    </div>
    <div class="card glow-border p-4 mb-6 text-center">
      <div class="text-xs text-gray-500 mb-1">合計スコア</div>
      <div class="text-3xl font-black gold-text">${computeScore()} pt</div>
    </div>
    <p class="text-xs text-gray-400 text-center mb-6 leading-relaxed">一番大切なのは、答えを導き出す過程で目の前の仲間の話に耳を傾けた時間です。<br>今日出会った4人は、これからも支え合う同期です。</p>
    <button onclick="goTo('dashboard')" class="btn-outline w-full py-3">ダッシュボードへ戻る</button>
  </div>`;
}
function toggleIntroBonus(i){
  state.introBonusChecks[i] = !state.introBonusChecks[i];
  saveState();
  render();
}

/* ---------- 運営者用 QRコード生成ページ ---------- */
function viewAdminQR(){
  const all = [
    ...PUZZLES.map(p=>({qrId:p.qrId, label:`【本物】${p.level} ${p.title}`, location:''})),
    ...DUMMIES.map(d=>({qrId:d.qrId, label:`【ダミー】${d.title}`, location:d.location}))
  ];
  const cards = all.map((item,i)=>`
    <div class="card p-4 mb-4 text-center">
      <div class="text-sm font-bold mb-1">${item.label}</div>
      ${item.location?`<div class="text-xs text-gray-400 mb-2">設置場所：${item.location}</div>`:''}
      <canvas id="qr-canvas-${i}" class="mx-auto bg-white p-2 rounded-lg"></canvas>
      <div class="text-[11px] text-gray-500 mt-2">ID: ${item.qrId}</div>
    </div>`).join('');
  return `
  <div class="flex-1 flex flex-col fade-in">
    <div class="flex justify-between items-center mb-4 no-print">
      <h2 class="text-lg font-bold">運営者用：QRコード生成</h2>
      <button onclick="goTo('top')" class="text-sm text-gray-400 underline">戻る</button>
    </div>
    <button onclick="window.print()" class="btn-outline w-full py-3 mb-4 no-print">🖨 印刷する</button>
    ${cards}
  </div>`;
}
function renderAdminQRCodes(){
  const all = [...PUZZLES.map(p=>p.qrId), ...DUMMIES.map(d=>d.qrId)];
  const base = window.location.origin + window.location.pathname;
  all.forEach((qrId,i)=>{
    const canvas = document.getElementById(`qr-canvas-${i}`);
    if(canvas && typeof QRCode !== 'undefined'){
      const url = `${base}?qr=${encodeURIComponent(qrId)}`;
      QRCode.toCanvas(canvas, url, { width:180, margin:1, color:{ dark:'#0f0f0f', light:'#ffffff' } });
    }
  });
}

/* afterRender に管理QR描画を追加 */
const _origAfterRender = afterRender;
afterRender = function(){
  _origAfterRender();
  if(currentView === 'admin-qr') renderAdminQRCodes();
};

/* =========================================================
   初期化（QR/リンクから ?qr=QR_Nazo1 のような直接遷移にも対応）
   ========================================================= */
(function initFromUrl(){
  try{
    const params = new URLSearchParams(window.location.search);
    const qrParam = params.get('qr');
    if(qrParam){
      if(state.team && state.player){
        currentView = 'dashboard';
        render();
        handleScannedText(qrParam);
        return;
      }else{
        pendingQrFromUrl = qrParam;
      }
    }
  }catch(e){}
  render();
})();
</script>
